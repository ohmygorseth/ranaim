<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RanAim - Ranheim Esport</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Lydeffekter -->
  <audio id="sound-hit" src="assets/sounds/hit.wav" preload="auto"></audio>
  <audio id="sound-miss" src="assets/sounds/miss.wav" preload="auto"></audio>

  <div id="app">

    <!-- SKJERM: Velg gruppe -->
    <section id="screen-group-select" class="screen">
      <div class="page-stack">
        <img src="assets/ril-logo.png" alt="Ranheim Esport" class="logo-top" onerror="this.style.display='none'" />
        <div class="panel-center">
          <h1 class="brand-title">RanAim</h1>
          <p class="brand-subtitle">Ranheim Esport sin Aim Trainer</p>
          <p class="subtitle">Velg din gruppe</p>
          <div id="group-list" class="group-list"></div>
        </div>
      </div>
    </section>

    <!-- SKJERM: Passord -->
    <section id="screen-password" class="screen hidden">
      <div class="panel-center">
        <h2 id="password-group-name"></h2>
        <form id="password-form">
          <input type="password" id="password-input" placeholder="Gruppepassord" autocomplete="off" required />
          <p id="password-error" class="error-text hidden">Feil passord, prøv igjen.</p>
          <button type="submit" class="btn-primary">Fortsett</button>
        </form>
        <button id="back-to-groups" class="btn-link">&larr; Bytt gruppe</button>
      </div>
    </section>

    <!-- SKJERM: Nickname -->
    <section id="screen-nickname" class="screen hidden">
      <div class="panel-center">
        <h2>Skriv inn kallenavn</h2>
        <p class="nickname-group" id="nickname-group-name"></p>
        <p class="hint-text">Ikke bruk ditt ekte navn. Upassende navn slettes av trenerne.</p>
        <form id="nickname-form">
          <input type="text" id="nickname-input" maxlength="20" placeholder="Kallenavn" autocomplete="off" required />
          <button type="submit" class="btn-primary">Gå videre</button>
        </form>
        <button id="nickname-back-btn" class="btn-link">&larr; Bytt gruppe</button>
      </div>
    </section>

    <!-- SKJERM: Hub (modusvalg) -->
    <section id="screen-hub" class="screen hidden">
      <div class="hub-layout">
        <div class="hub-main">
          <header class="hub-header">
            <div class="hub-header-left">
              <img src="assets/ril-logo.png" alt="Ranheim Esport" class="hub-logo" onerror="this.style.display='none'" />
              <p class="hub-meta">
                Gruppe: <strong id="hub-group-name"></strong> &nbsp;|&nbsp;
                Spiller: <strong id="hub-nickname"></strong>
              </p>
            </div>
            <button id="change-group-btn" class="btn-link">Bytt gruppe</button>
          </header>

          <h2 class="section-title">Velg modus</h2>
          <div id="mode-list" class="mode-list"></div>
        </div>

        <aside class="sidebar">
          <h3>Highscore</h3>
          <select id="sidebar-lb-mode-select" class="mode-select"></select>
          <div id="sidebar-lb-tabs" class="lb-tabs">
            <button class="lb-tab active" data-tab="weekly">Treningens<br>beste</button>
            <button class="lb-tab" data-tab="group">Din gruppe<br>all time</button>
            <button class="lb-tab" data-tab="global">Alle grupper<br>all time</button>
          </div>
          <div id="sidebar-lb-list" class="lb-list lb-list-scroll"></div>
        </aside>
      </div>
    </section>

    <!-- SKJERM: Spill -->
    <section id="screen-game" class="screen hidden">
      <div class="game-container">
        <div id="countdown-overlay" class="countdown-overlay">
          <img src="assets/ril-logo.png" alt="" class="countdown-logo" onerror="this.style.display='none'" />
          <span id="countdown-number">3</span>
        </div>
        <canvas id="game-canvas" width="1200" height="700" class="hidden"></canvas>
        <div id="small-window-warning" class="small-window-warning hidden">Spill i maksimert vindu for rettferdig score</div>
        <img src="assets/favicon.png" alt="" class="game-watermark" onerror="this.style.display='none'" />
      </div>
    </section>

    <!-- SKJERM: Resultat -->
    <section id="screen-result" class="screen hidden">
      <div class="panel-center">
        <div id="result-banner" class="result-banner hidden"></div>
        <h2>Runde ferdig</h2>
        <div class="result-stats">
          <div class="stat-block">
            <span class="stat-value" id="result-score">0</span>
            <span class="stat-label">Poeng</span>
          </div>
          <div id="result-extra-stats" class="result-stats"></div>
        </div>
        <p id="result-personal-best" class="result-pb"></p>
        <p id="result-context" class="result-context"></p>
        <div class="result-actions">
          <button id="play-again-btn" class="btn-primary">Spill igjen</button>
          <button id="back-to-hub-btn" class="btn-link">Tilbake til meny</button>
        </div>
      </div>
    </section>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
